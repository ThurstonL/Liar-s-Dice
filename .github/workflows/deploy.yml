name: Deploy to Mac Mini

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restart services
        run: |
          if [ -f "$HOME/Library/LaunchAgents/com.thepregames.liarsdice.backend.plist" ]; then
            ./scripts/manage_services.sh restart
          else
            pm2 restart liars-dice || pm2 start server/dist/index.js --name liars-dice
            pm2 save
          fi
